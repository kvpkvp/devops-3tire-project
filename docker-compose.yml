services:
  mysql:
    image: mysql:8.0
    container_name: devops-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: devopsdb
      MYSQL_USER: backend_user
      MYSQL_PASSWORD: backend_pass
    volumes:
      - mysql_data:/var/lib/mysql

  backend:
    image: devops-backend:latest
    container_name: devops-backend
    depends_on:
      - mysql
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:mysql://mysql:3306/devopsdb
      DB_USER: backend_user
      DB_PASS: backend_pass

volumes:
  mysql_data:

